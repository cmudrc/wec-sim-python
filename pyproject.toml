[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wec-sim-python"
version = "0.1.0"
description = "Python WEC dynamics with MATLAB WEC-Sim parity checks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "randomgen>=2.3,<3",
    "scipy",
    "matplotlib",
    "h5py",
    "trimesh",
    "networkx",
    "control",
    "openpyxl",
]

[project.urls]
Repository = "https://github.com/cmudrc/wec-sim-python"

[project.scripts]
wecsim = "wecsim.interface.cli:main"

[tool.setuptools.packages.find]
include = ["wecsim*"]
