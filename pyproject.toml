[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wec-sim-python"
version = "0.1.0"
description = "Python WEC dynamics with MATLAB WEC-Sim parity checks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "randomgen>=2.3,<3",
    "scipy",
    "h5py",
    "trimesh",
]

[project.optional-dependencies]
excel = ["openpyxl"]
plot = ["matplotlib"]
paraview = ["pyvista>=0.49,<1"]
test = ["pytest>=8", "pytest-cov>=5", "pytest-xdist>=3", "openpyxl"]

[project.urls]
Repository = "https://github.com/cmudrc/wec-sim-python"

[project.scripts]
wecsim = "wecsim.interface.cli:main"

[tool.setuptools.packages.find]
include = ["wecsim*"]
