name: RM3 PTO Extension unchanged-input physical comparison

on:
  pull_request:
    paths:
      - '.github/workflows/rm3-pto-extension-published-physical.yml'
      - 'tests/test_rm3_pto_extension_published_physical.py'
      - 'tests/fixtures/matlab/rm3_pto_extension_published_physical/**'
      - 'tests/matlab/reference_model_baseline.m'
      - 'wecsim/dynamics/caseDynamics.py'
      - 'wecsim/dynamics/rm3Regular.py'
      - 'wecsim/hydrodynamics/radiation.py'
  workflow_dispatch:

jobs:
  published-source-and-physical:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim
          ref: 0753b2e47f2457c078751dcfe5d251d1767b80ab
          path: matlab-ref
          filter: blob:none
          sparse-checkout: |
            source
            examples/RM3
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim_Applications
          ref: d53d4d4c9eda2581f04204f5d394a6ef84bb099e
          path: applications
          filter: blob:none
          lfs: true
          sparse-checkout: |
            _Common_Input_Files/RM3
            RM3_PTO_Extension
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Simulink Simscape Simscape_Multibody
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests/matlab'); reference_model_baseline('RM3_PTO_Extension')
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test]"
      - name: Verify fresh unchanged source and independent physical gate
        run: >-
          python -m pytest -q -s
          tests/test_rm3_pto_extension_published_physical.py
          tests/test_rm3_pto_extension_parity.py
        env:
          WEC_SIM_APPLICATIONS_DIR: applications
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rm3-pto-extension-published-physical
          path: |
            matlab-reference-model-output/RM3_PTO_Extension_*_body*.csv
            matlab-reference-model-output/RM3_PTO_Extension_*_pto1.csv
            applications/_Common_Input_Files/RM3/hydroData/rm3.h5
          if-no-files-found: warn
