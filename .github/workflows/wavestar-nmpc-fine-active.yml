name: MATLAB WaveStar fine-step active NMPC

on:
  pull_request:
    paths:
      - '.github/workflows/wavestar-nmpc-fine-active.yml'
      - 'tests/matlab/reference_model_baseline.m'
      - 'tests/matlab/wavestar_nmpc_forecast_probe.m'
      - 'tests/test_wavestar_nmpc_fine_active.py'
      - 'tests/test_wavestar_nmpc_split_step.py'
      - 'wecsim/wavestarNmpc.py'
      - 'wecsim/wavestar.py'
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim
          ref: 0753b2e47f2457c078751dcfe5d251d1767b80ab
          path: matlab-ref
          filter: blob:none
          sparse-checkout: source
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim_Applications
          ref: d53d4d4c9eda2581f04204f5d394a6ef84bb099e
          path: applications
          filter: blob:none
          lfs: true
          sparse-checkout: |
            WECCCOMP/WECCCOMP_Nonlinear_Model_Predictive
            WECCCOMP/hydroData
            WECCCOMP/geometry
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Simulink Simscape Simscape_Multibody Stateflow Control_System_Toolbox Optimization_Toolbox System_Identification_Toolbox Statistics_and_Machine_Learning_Toolbox
      - name: Preserve pinned WaveStar inputs for the second run
        run: |
          cp applications/WECCCOMP/WECCCOMP_Nonlinear_Model_Predictive/wecSimInputFile.m "$RUNNER_TEMP/wecSimInputFile.m"
          cp applications/WECCCOMP/WECCCOMP_Nonlinear_Model_Predictive/controller_init.m "$RUNNER_TEMP/controller_init.m"
          cp applications/WECCCOMP/WECCCOMP_Nonlinear_Model_Predictive/userDefinedFunctions.m "$RUNNER_TEMP/userDefinedFunctions.m"
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests/matlab'); reference_model_baseline('WECCCOMP_NMPC_FINE_ACTIVE_DIAG')
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests/matlab'); wavestar_nmpc_forecast_probe
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_wavestar_nmpc_fine_active.py
        env:
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
      - name: Restore pinned WaveStar inputs
        run: |
          cp "$RUNNER_TEMP/wecSimInputFile.m" applications/WECCCOMP/WECCCOMP_Nonlinear_Model_Predictive/wecSimInputFile.m
          cp "$RUNNER_TEMP/controller_init.m" applications/WECCCOMP/WECCCOMP_Nonlinear_Model_Predictive/controller_init.m
          cp "$RUNNER_TEMP/userDefinedFunctions.m" applications/WECCCOMP/WECCCOMP_Nonlinear_Model_Predictive/userDefinedFunctions.m
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests/matlab'); reference_model_baseline('WECCCOMP_NMPC_SPLIT_STEP_DIAG')
      - run: python -m pytest -q -s tests/test_wavestar_nmpc_split_step.py
        env:
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wavestar-nmpc-fine-active
          path: |
            matlab-reference-model-output/WECCCOMP_NMPC_FINE_ACTIVE_DIAG_*
            matlab-reference-model-output/WECCCOMP_NMPC_SPLIT_STEP_DIAG_*
            applications/WECCCOMP/hydroData/wavestar.h5
