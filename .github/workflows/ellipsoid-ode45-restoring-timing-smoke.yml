name: Ellipsoid ode45 restoring timing diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/ellipsoid-ode45-restoring-timing-smoke.yml'
      - 'tests/matlab/ellipsoid_ode45_restoring_timing_smoke.m'
      - 'tools/check_ellipsoid_ode45_restoring_timing.py'
  workflow_dispatch:
    inputs:
      duration:
        description: Source duration (2 s smoke or 150 s full)
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        wave: [Regular, RegularCIC]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    name: ${{ matrix.wave }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim
          ref: 0753b2e47f2457c078751dcfe5d251d1767b80ab
          path: matlab-ref
          filter: blob:none
          sparse-checkout: source
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim_Applications
          ref: d53d4d4c9eda2581f04204f5d394a6ef84bb099e
          path: applications
          filter: blob:none
          lfs: true
          sparse-checkout: Nonlinear_Hydro
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Simulink Simscape Simscape_Multibody
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests/matlab'); waveCase='${{ matrix.wave }}'; mode='baseline'; duration='${{ inputs.duration || 'smoke' }}'; ellipsoid_ode45_restoring_timing_smoke
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests/matlab'); waveCase='${{ matrix.wave }}'; mode='continuous_restoring'; duration='${{ inputs.duration || 'smoke' }}'; ellipsoid_ode45_restoring_timing_smoke
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests/matlab'); waveCase='${{ matrix.wave }}'; mode='continuous_nonlinear'; duration='${{ inputs.duration || 'smoke' }}'; ellipsoid_ode45_restoring_timing_smoke
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]"
      - name: Check restoring timing and source comparison
        run: >-
          python tools/check_ellipsoid_ode45_restoring_timing.py
          "${{ matrix.wave }}"
          "matlab-ellipsoid-ode45-restoring-timing/${{ matrix.wave }}"
          --duration "${{ inputs.duration || 'smoke' }}"
          --applications applications
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ellipsoid-ode45-restoring-timing-${{ matrix.wave }}-${{ inputs.duration || 'smoke' }}
          path: |
            matlab-ellipsoid-ode45-restoring-timing/${{ matrix.wave }}/
            applications/Nonlinear_Hydro/hydroData/ellipsoid.h5
          if-no-files-found: ignore
