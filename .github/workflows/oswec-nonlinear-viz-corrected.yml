name: MATLAB OSWEC nonlinear corrected baseline

on:
  pull_request:
    paths:
      - '.github/workflows/oswec-nonlinear-viz-corrected.yml'
      - 'tests/matlab/oswec_nonlinear_viz_corrected_baseline.m'
      - 'tests/test_oswec_nonlinear_viz_corrected.py'
      - 'tests/fixtures/matlab/oswec_nonlinear_viz_corrected/**'
      - 'tools/archive_oswec_nonlinear_viz_corrected.py'
      - 'wecsim/hydrodynamics/nonlinearHydro.py'
      - 'wecsim/visualization/paraviewClass.py'
  workflow_dispatch:

jobs:
  corrected:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim
          ref: 0753b2e47f2457c078751dcfe5d251d1767b80ab
          path: matlab-ref
          filter: blob:none
          sparse-checkout: source
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim_Applications
          ref: d53d4d4c9eda2581f04204f5d394a6ef84bb099e
          path: applications
          filter: blob:none
          lfs: true
          sparse-checkout: |
            _Common_Input_Files/OSWEC
            Paraview_Visualization/OSWEC_NonLinear_Viz
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Simulink Simscape Simscape_Multibody
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests/matlab'); oswec_nonlinear_viz_corrected_baseline
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]"
      - name: Gate independent Python motion, pressure, and full VTP scene
        run: python -m pytest -q -s tests/test_oswec_nonlinear_viz_corrected.py
        env:
          WEC_SIM_OSWEC_CORRECTED_DIR: matlab-oswec-nonlinear-viz-corrected
          WEC_SIM_OSWEC_CORRECTED_VTP_DIR: applications/Paraview_Visualization/OSWEC_NonLinear_Viz_corrected_0.0125/vtk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matlab-oswec-nonlinear-viz-corrected
          path: matlab-oswec-nonlinear-viz-corrected/
