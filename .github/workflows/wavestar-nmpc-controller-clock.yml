name: MATLAB WaveStar NMPC controller-clock probe

on:
  pull_request:
    paths:
      - '.github/workflows/wavestar-nmpc-controller-clock.yml'
      - 'tests/matlab/wavestar_controller_clock_probe.m'
      - 'tests/test_wavestar_held_clock_full.py'
      - 'tests/test_wavestar_held_clock_control.py'
  workflow_dispatch:

jobs:
  source:
    strategy:
      matrix:
        include:
          - end_time: 15.2
            plant_step: 0.025
          - end_time: 225
            plant_step: 0.025
          - end_time: 225
            plant_step: 0.05
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim
          ref: 0753b2e47f2457c078751dcfe5d251d1767b80ab
          path: matlab-ref
          filter: blob:none
          sparse-checkout: source
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim_Applications
          ref: d53d4d4c9eda2581f04204f5d394a6ef84bb099e
          path: applications
          filter: blob:none
          lfs: true
          sparse-checkout: |
            WECCCOMP/WECCCOMP_Nonlinear_Model_Predictive
            WECCCOMP/hydroData
            WECCCOMP/geometry
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Simulink Simscape Simscape_Multibody Stateflow Control_System_Toolbox Optimization_Toolbox System_Identification_Toolbox Statistics_and_Machine_Learning_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests/matlab'); wavestar_controller_clock_probe(${{ matrix.end_time }}, ${{ matrix.plant_step }})
      - uses: actions/setup-python@v7
        if: matrix.end_time == 225
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
        if: matrix.end_time == 225
      - run: python -m pytest -q -s tests/test_wavestar_held_clock_full.py
        if: matrix.end_time == 225 && matrix.plant_step == 0.025
        env:
          WEC_SIM_WAVESTAR_HELD_CLOCK_DIR: wavestar-controller-clock-output
      - run: python -m pytest -q -s tests/test_wavestar_held_clock_control.py
        if: matrix.end_time == 225 && matrix.plant_step == 0.05
        env:
          WEC_SIM_WAVESTAR_CLOCK_CONTROL_DIR: wavestar-controller-clock-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wavestar-nmpc-controller-clock-${{ matrix.end_time }}s-${{ matrix.plant_step }}s-step
          path: wavestar-controller-clock-output/
