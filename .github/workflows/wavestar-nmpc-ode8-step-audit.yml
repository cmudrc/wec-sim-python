name: MATLAB WaveStar NMPC ode8 pre-control step audit

on:
  pull_request:
    paths:
      - '.github/workflows/wavestar-nmpc-ode8-step-audit.yml'
      - 'tests/matlab/reference_model_baseline.m'
      - 'tests/test_wavestar_nmpc_ode8_step_audit.py'
      - 'wecsim/dynamics/wavestar.py'
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim
          ref: 0753b2e47f2457c078751dcfe5d251d1767b80ab
          path: matlab-ref
          filter: blob:none
          sparse-checkout: source
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim_Applications
          ref: d53d4d4c9eda2581f04204f5d394a6ef84bb099e
          path: applications
          filter: blob:none
          lfs: true
          sparse-checkout: |
            WECCCOMP/WECCCOMP_Nonlinear_Model_Predictive
            WECCCOMP/hydroData
            WECCCOMP/geometry
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Simulink Simscape Simscape_Multibody Stateflow Control_System_Toolbox Optimization_Toolbox System_Identification_Toolbox Statistics_and_Machine_Learning_Toolbox
      - name: Save pinned application inputs
        run: |
          cp applications/WECCCOMP/WECCCOMP_Nonlinear_Model_Predictive/wecSimInputFile.m "$RUNNER_TEMP/wecSimInputFile.m"
          cp applications/WECCCOMP/WECCCOMP_Nonlinear_Model_Predictive/userDefinedFunctions.m "$RUNNER_TEMP/userDefinedFunctions.m"
          mkdir wavestar-ode8-step
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests/matlab'); reference_model_baseline('WECCCOMP_NMPC_ODE8_STEP', 0.05)
      - name: Save 50 ms source and fitted hydrodynamics
        run: |
          mv matlab-reference-model-output wavestar-ode8-step/50ms
          sha256sum applications/WECCCOMP/hydroData/wavestar.h5 > wavestar-ode8-step/hydro.sha256
          cp "$RUNNER_TEMP/wecSimInputFile.m" applications/WECCCOMP/WECCCOMP_Nonlinear_Model_Predictive/wecSimInputFile.m
          cp "$RUNNER_TEMP/userDefinedFunctions.m" applications/WECCCOMP/WECCCOMP_Nonlinear_Model_Predictive/userDefinedFunctions.m
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests/matlab'); reference_model_baseline('WECCCOMP_NMPC_ODE8_STEP', 0.025)
      - name: Save 25 ms source
        run: |
          sha256sum --check wavestar-ode8-step/hydro.sha256
          mv matlab-reference-model-output wavestar-ode8-step/25ms
          cp "$RUNNER_TEMP/wecSimInputFile.m" applications/WECCCOMP/WECCCOMP_Nonlinear_Model_Predictive/wecSimInputFile.m
          cp "$RUNNER_TEMP/userDefinedFunctions.m" applications/WECCCOMP/WECCCOMP_Nonlinear_Model_Predictive/userDefinedFunctions.m
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests/matlab'); reference_model_baseline('WECCCOMP_NMPC_ODE8_STEP', 0.0125)
      - name: Save 12.5 ms source
        run: |
          sha256sum --check wavestar-ode8-step/hydro.sha256
          mv matlab-reference-model-output wavestar-ode8-step/12p5ms
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q -s tests/test_wavestar_nmpc_ode8_step_audit.py
        env:
          WEC_SIM_WAVESTAR_ODE8_STEP_DIR: wavestar-ode8-step
          WEC_SIM_WAVESTAR_H5: applications/WECCCOMP/hydroData/wavestar.h5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wavestar-nmpc-ode8-pre-control-step-audit
          path: |
            wavestar-ode8-step/
            applications/WECCCOMP/hydroData/wavestar.h5
