name: Ellipsoid ode45 isolated finest source step

on:
  pull_request:
    paths:
      - '.github/workflows/ellipsoid-ode45-finest-isolated.yml'
      - 'tests/matlab/ellipsoid_ode45_convergence.m'
  workflow_dispatch:

jobs:
  regular:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim
          ref: 0753b2e47f2457c078751dcfe5d251d1767b80ab
          path: matlab-ref
          filter: blob:none
          sparse-checkout: source
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim_Applications
          ref: d53d4d4c9eda2581f04204f5d394a6ef84bb099e
          path: applications
          filter: blob:none
          lfs: true
          sparse-checkout: Nonlinear_Hydro
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Simulink Simscape Simscape_Multibody
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests/matlab'); ellipsoid_ode45_convergence('Regular', 'step000625')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ellipsoid-ode45-finest-isolated-Regular
          path: |
            matlab-ellipsoid-ode45-convergence/Regular/
            applications/Nonlinear_Hydro/hydroData/ellipsoid.h5
            applications/Nonlinear_Hydro/geometry/elipsoid.stl
