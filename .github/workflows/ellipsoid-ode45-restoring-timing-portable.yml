name: Ellipsoid ode45 force-timing portable gate

on:
  pull_request:
    paths:
      - '.github/workflows/ellipsoid-ode45-restoring-timing-portable.yml'
      - 'tests/test_ellipsoid_ode45_restoring_timing_portable.py'
      - 'tests/test_ellipsoid_ode45_convergence.py'
      - 'tests/fixtures/matlab/ellipsoid_ode45_restoring_timing/**'
      - 'tests/fixtures/matlab/ellipsoid_ode45_convergence/**'
      - 'tests/fixtures/matlab/ellipsoid_ode45_nonlinear_clock/**'
      - 'wecsim/hydrodynamics/nonlinearHydro.py'
      - 'wecsim/dynamics/caseDynamics.py'
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q -s tests/test_ellipsoid_ode45_restoring_timing_portable.py
