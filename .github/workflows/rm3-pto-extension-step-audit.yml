name: MATLAB RM3 PTO extension step audit

on:
  pull_request:
    paths:
      - '.github/workflows/rm3-pto-extension-step-audit.yml'
      - 'tests/matlab/rm3_pto_extension_step_audit.m'
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim
          ref: 0753b2e47f2457c078751dcfe5d251d1767b80ab
          path: matlab-ref
          filter: blob:none
          sparse-checkout: source
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim_Applications
          ref: d53d4d4c9eda2581f04204f5d394a6ef84bb099e
          path: applications
          filter: blob:none
          lfs: true
          sparse-checkout: |
            _Common_Input_Files/RM3
            RM3_PTO_Extension
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Simulink Simscape Simscape_Multibody
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests/matlab'); rm3_pto_extension_step_audit()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matlab-rm3-pto-extension-step-audit
          path: matlab-rm3-pto-extension-step-audit/
