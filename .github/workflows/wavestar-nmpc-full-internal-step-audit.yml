name: MATLAB WaveStar full-duration fixed-input ode8 step audit

on:
  pull_request:
    paths:
      - '.github/workflows/wavestar-nmpc-full-internal-step-audit.yml'
      - 'tests/matlab/reference_model_baseline.m'
      - 'tests/matlab/wec_sim_solver_substep.m'
      - 'tests/test_wavestar_nmpc_full_internal_step.py'
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim
          ref: 0753b2e47f2457c078751dcfe5d251d1767b80ab
          path: matlab-ref
          filter: blob:none
          sparse-checkout: source
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim_Applications
          ref: d53d4d4c9eda2581f04204f5d394a6ef84bb099e
          path: applications
          filter: blob:none
          lfs: true
          sparse-checkout: |
            WECCCOMP/WECCCOMP_Nonlinear_Model_Predictive
            WECCCOMP/hydroData
            WECCCOMP/geometry
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Simulink Simscape Simscape_Multibody Stateflow Control_System_Toolbox Optimization_Toolbox System_Identification_Toolbox Statistics_and_Machine_Learning_Toolbox
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests/matlab'); reference_model_baseline('WECCCOMP_NMPC_INTERNAL_STEP_FULL', 0.025)
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q -s tests/test_wavestar_nmpc_full_internal_step.py
        env:
          WEC_SIM_WAVESTAR_FULL_INTERNAL_STEP_DIR: matlab-reference-model-output
          WEC_SIM_WAVESTAR_H5: applications/WECCCOMP/hydroData/wavestar.h5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wavestar-nmpc-full-fixed-input-ode8-step-audit
          path: |
            matlab-reference-model-output/
            applications/WECCCOMP/hydroData/wavestar.h5
