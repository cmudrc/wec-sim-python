name: MATLAB OSWEC nonlinear visualization pressures

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/oswec-nonlinear-viz-pressure.yml'
      - 'tests/matlab/oswec_nonlinear_viz_pressure_baseline.m'
      - 'tests/test_oswec_nonlinear_viz_pressure.py'
      - 'wecsim/nonlinearHydro.py'
  pull_request:
    paths:
      - '.github/workflows/oswec-nonlinear-viz-pressure.yml'
      - 'tests/matlab/oswec_nonlinear_viz_pressure_baseline.m'
      - 'tests/test_oswec_nonlinear_viz_pressure.py'
      - 'wecsim/nonlinearHydro.py'
  workflow_dispatch:

jobs:
  pressure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim
          ref: 0753b2e47f2457c078751dcfe5d251d1767b80ab
          path: matlab-ref
          filter: blob:none
          sparse-checkout: source
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim_Applications
          ref: d53d4d4c9eda2581f04204f5d394a6ef84bb099e
          path: applications
          filter: blob:none
          lfs: true
          sparse-checkout: |
            _Common_Input_Files/OSWEC
            Paraview_Visualization/OSWEC_NonLinear_Viz
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Simulink Simscape Simscape_Multibody
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests/matlab'); oswec_nonlinear_viz_pressure_baseline
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_oswec_nonlinear_viz_pressure.py
        env:
          WEC_SIM_MATLAB_OSWEC_PRESSURE_DIR: matlab-oswec-nonlinear-viz-pressure
          WEC_SIM_OSWEC_FLAP_STL: applications/_Common_Input_Files/OSWEC/geometry/flap.stl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matlab-oswec-nonlinear-viz-pressure
          path: matlab-oswec-nonlinear-viz-pressure/
