name: MATLAB Sphere moving Morison current parity

on:
  pull_request:
    paths:
      - '.github/workflows/sphere-morison-normal-current-parity.yml'
      - 'tests/matlab/reference_model_baseline.m'
      - 'tests/test_sphere_normal_current_parity.py'
      - 'wecsim/morison.py'
      - 'wecsim/caseDynamics.py'
      - 'wecsim/api.py'
  workflow_dispatch:

jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim
          ref: 0753b2e47f2457c078751dcfe5d251d1767b80ab
          path: matlab-ref
          filter: blob:none
          sparse-checkout: source
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim_Applications
          ref: d53d4d4c9eda2581f04204f5d394a6ef84bb099e
          path: applications
          filter: blob:none
          lfs: true
          sparse-checkout: |
            _Common_Input_Files/Sphere
            Free_Decay/1m-ME
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Simulink Simscape Simscape_Multibody
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests/matlab'); reference_model_baseline('SPHERE_MOVING_MORISON_NORMAL')
      - run: git -C applications restore -- Free_Decay/1m-ME/wecSimInputFile.m
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests/matlab'); reference_model_baseline('SPHERE_MOVING_MORISON_NORMAL_CURRENT')
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_sphere_normal_tangential_parity.py tests/test_sphere_normal_current_parity.py
        env:
          WEC_SIM_SPHERE_H5: applications/_Common_Input_Files/Sphere/hydroData/sphere.h5
          WEC_SIM_MATLAB_MODEL_OUTPUT_DIR: matlab-reference-model-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sphere-morison-normal-current-pair
          path: |
            matlab-reference-model-output/SPHERE_MOVING_MORISON_NORMAL*
            applications/_Common_Input_Files/Sphere/hydroData/sphere.h5
