name: Ellipsoid ode45 continuous nonlinear MaxStep screen

on:
  pull_request:
    paths:
      - '.github/workflows/ellipsoid-ode45-restoring-step-screen.yml'
      - 'tests/matlab/ellipsoid_ode45_restoring_timing_smoke.m'
  workflow_dispatch:

jobs:
  source-step:
    strategy:
      fail-fast: false
      matrix:
        wave: [Regular, RegularCIC]
        # The two finer values continue diagnosis after the predeclared screen.
        max_step: ['0.025', '0.0125', '0.00625', '0.003125']
    runs-on: ubuntu-latest
    timeout-minutes: 150
    name: ${{ matrix.wave }} MaxStep ${{ matrix.max_step }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim
          ref: 0753b2e47f2457c078751dcfe5d251d1767b80ab
          path: matlab-ref
          filter: blob:none
          sparse-checkout: source
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim_Applications
          ref: d53d4d4c9eda2581f04204f5d394a6ef84bb099e
          path: applications
          filter: blob:none
          lfs: true
          sparse-checkout: Nonlinear_Hydro
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Simulink Simscape Simscape_Multibody
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests/matlab'); waveCase='${{ matrix.wave }}'; mode='continuous_nonlinear'; duration='full'; maxStep=${{ matrix.max_step }}; ellipsoid_ode45_restoring_timing_smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ellipsoid-ode45-restoring-${{ matrix.wave }}-maxstep-${{ matrix.max_step }}
          path: |
            matlab-ellipsoid-ode45-restoring-timing-step/${{ matrix.wave }}/
            applications/Nonlinear_Hydro/hydroData/ellipsoid.h5
          if-no-files-found: ignore
