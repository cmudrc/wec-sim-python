name: RM3 PTO Extension fixed-step isolation

on:
  pull_request:
    paths:
      - '.github/workflows/rm3-pto-extension-fixedstep-only.yml'
      - 'tests/matlab/rm3_pto_extension_fixedstep_only.m'
      - 'tests/test_rm3_pto_extension_fixedstep_only.py'
      - 'tests/fixtures/matlab/rm3_pto_extension_fixedstep_only/**'
  workflow_dispatch:

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        case: [float, spar]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    name: ${{ matrix.case }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim
          ref: 0753b2e47f2457c078751dcfe5d251d1767b80ab
          path: matlab-ref
          filter: blob:none
          sparse-checkout: source
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim_Applications
          ref: d53d4d4c9eda2581f04204f5d394a6ef84bb099e
          path: applications
          filter: blob:none
          lfs: true
          sparse-checkout: |
            _Common_Input_Files/RM3
            RM3_PTO_Extension
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Simulink Simscape Simscape_Multibody
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests/matlab'); caseName='${{ matrix.case }}'; mode='published'; rm3_pto_extension_fixedstep_only
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests/matlab'); caseName='${{ matrix.case }}'; mode='fixedstep0125'; rm3_pto_extension_fixedstep_only
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q -s tests/test_rm3_pto_extension_fixedstep_only.py
        env:
          WEC_SIM_RM3_PTO_FIXEDSTEP_DIR: matlab-rm3-pto-fixedstep-only
          WEC_SIM_RM3_PTO_CASE: ${{ matrix.case }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rm3-pto-extension-fixedstep-${{ matrix.case }}
          path: |
            matlab-rm3-pto-fixedstep-only/${{ matrix.case }}/
            applications/_Common_Input_Files/RM3/hydroData/rm3.h5
