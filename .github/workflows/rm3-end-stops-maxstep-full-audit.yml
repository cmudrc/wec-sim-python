name: RM3 End Stops full-duration MaxStep audit

on:
  pull_request:
    paths:
      - '.github/workflows/rm3-end-stops-maxstep-full-audit.yml'
      - 'tests/matlab/rm3_end_stops_maxstep_audit.m'
      - 'tests/test_rm3_end_stops_maxstep_audit.py'
      - 'tests/test_rm3_end_stops_maxstep_public.py'
      - 'tests/test_rm3_end_stops_internal_steps.py'
      - 'tests/fixtures/matlab/rm3_end_stops_maxstep_400s.npz'
      - 'tests/fixtures/matlab/rm3_end_stops_maxstep_400s.md'
      - 'tests/fixtures/matlab/rm3_end_stops_internal_steps.npz'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim
          ref: 0753b2e47f2457c078751dcfe5d251d1767b80ab
          path: matlab-ref
          filter: blob:none
          sparse-checkout: source
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim_Applications
          ref: d53d4d4c9eda2581f04204f5d394a6ef84bb099e
          path: applications
          filter: blob:none
          lfs: true
          sparse-checkout: |
            _Common_Input_Files/RM3
            End_Stops
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Simulink Simscape Simscape_Multibody
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests/matlab'); rm3_end_stops_maxstep_audit(400)
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]"
      - name: Check regenerated MATLAB baseline and independent Python motion
        run: >-
          python -m pytest -q -s
          tests/test_rm3_end_stops_maxstep_audit.py
          tests/test_rm3_end_stops_maxstep_public.py
          tests/test_rm3_end_stops_internal_steps.py
        env:
          WEC_SIM_RM3_END_STOPS_MAXSTEP_DIR: matlab-rm3-end-stops-maxstep-400s
          WEC_SIM_RM3_END_STOPS_MAXSTEP_END_TIME: '400'
          WEC_SIM_RM3_H5: applications/_Common_Input_Files/RM3/hydroData/rm3.h5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rm3-end-stops-maxstep-400s-audit
          path: matlab-rm3-end-stops-maxstep-400s/
