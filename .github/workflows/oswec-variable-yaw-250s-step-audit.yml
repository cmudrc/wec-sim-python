name: MATLAB OSWEC selected-heading 250 s step audit

on:
  pull_request:
    paths:
      - '.github/workflows/oswec-variable-yaw-250s-step-audit.yml'
      - 'tests/matlab/oswec_variable_yaw_250s_step_audit.m'
      - 'tests/test_variable_yaw_heading_bank.py'
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim
          ref: 0753b2e47f2457c078751dcfe5d251d1767b80ab
          path: matlab-ref
          filter: blob:none
          sparse-checkout: source
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim_Applications
          ref: d53d4d4c9eda2581f04204f5d394a6ef84bb099e
          path: applications
          filter: blob:none
          lfs: true
          sparse-checkout: |
            _Common_Input_Files/OSWEC
            Variable_Hydro/Passive_Yaw
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Simulink Simscape Simscape_Multibody
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests/matlab'); oswec_variable_yaw_250s_step_audit()
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q -s tests/test_variable_yaw_heading_bank.py::test_irregular_250s_selected_bank_step_diagnostic
        env:
          WEC_SIM_APPLICATIONS_DIR: applications
          WEC_SIM_MATLAB_250S_AUDIT_DIR: matlab-oswec-variable-yaw-250s-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matlab-oswec-variable-yaw-250s-step-audit
          path: matlab-oswec-variable-yaw-250s-audit/
