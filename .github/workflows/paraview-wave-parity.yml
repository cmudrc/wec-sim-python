name: MATLAB ParaView mesh parity

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/paraview-wave-parity.yml'
      - 'tests/matlab/paraview_wave_baseline.m'
      - 'tests/matlab/paraview_body_baseline.m'
      - 'tests/matlab/paraview_mooring_baseline.m'
      - 'tests/test_paraview_wave_source.py'
      - 'tests/test_paraview_body_source.py'
      - 'tests/test_paraview_mooring_source.py'
      - 'wecsim/paraviewClass.py'
  pull_request:
    paths:
      - '.github/workflows/paraview-wave-parity.yml'
      - 'tests/matlab/paraview_wave_baseline.m'
      - 'tests/matlab/paraview_body_baseline.m'
      - 'tests/matlab/paraview_mooring_baseline.m'
      - 'tests/test_paraview_wave_source.py'
      - 'tests/test_paraview_body_source.py'
      - 'tests/test_paraview_mooring_source.py'
      - 'wecsim/paraviewClass.py'
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim
          ref: 0753b2e47f2457c078751dcfe5d251d1767b80ab
          path: matlab-ref
          filter: blob:none
          sparse-checkout: source
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath(genpath('matlab-ref/source')); addpath('tests/matlab'); paraview_wave_baseline; paraview_body_baseline; paraview_mooring_baseline
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_paraview_wave_source.py
        env:
          WEC_SIM_MATLAB_PARAVIEW_WAVE_DIR: matlab-paraview-wave
      - run: python -m pytest -q tests/test_paraview_body_source.py
        env:
          WEC_SIM_MATLAB_PARAVIEW_BODY_DIR: matlab-paraview-body
      - run: python -m pytest -q tests/test_paraview_mooring_source.py
        env:
          WEC_SIM_MATLAB_PARAVIEW_MOORING_DIR: matlab-paraview-mooring
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matlab-paraview-mesh
          path: |
            matlab-paraview-wave/
            matlab-paraview-body/
            matlab-paraview-mooring/
