name: MATLAB WaveStar single-thread 0.25 ms repeat

on:
  pull_request:
    paths:
      - '.github/workflows/wavestar-nmpc-reference-single-thread.yml'
      - 'tools/wavestar_nmpc_reference_repeat.py'
      - 'tools/wavestar_nmpc_reference_audit.py'
      - 'tools/wavestar_nmpc_reference_compare.py'
      - 'tests/matlab/reference_model_baseline.m'
      - 'tests/test_wavestar_split_step_portable.py'
  workflow_dispatch:

jobs:
  source-repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        repeat: [a, b]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim
          ref: 0753b2e47f2457c078751dcfe5d251d1767b80ab
          path: matlab-ref
          filter: blob:none
          sparse-checkout: source
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim_Applications
          ref: d53d4d4c9eda2581f04204f5d394a6ef84bb099e
          path: applications
          filter: blob:none
          lfs: true
          sparse-checkout: |
            WECCCOMP/WECCCOMP_Nonlinear_Model_Predictive
            WECCCOMP/hydroData
            WECCCOMP/geometry
      - name: Pin hydrodynamics and record runner CPU
        run: |
          cp tests/fixtures/matlab/wavestar_nmpc_split_step_225s/wavestar.h5 applications/WECCCOMP/hydroData/wavestar.h5
          cmp tests/fixtures/matlab/wavestar_nmpc_split_step_225s/wavestar.h5 applications/WECCCOMP/hydroData/wavestar.h5
          mkdir -p matlab-reference-model-output
          lscpu > matlab-reference-model-output/cpu.txt
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Simulink Simscape Simscape_Multibody Stateflow Control_System_Toolbox Optimization_Toolbox System_Identification_Toolbox Statistics_and_Machine_Learning_Toolbox
      - name: Generate source with one MATLAB computational thread
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            maxNumCompThreads(1);
            assert(maxNumCompThreads == 1);
            fid=fopen('matlab-reference-model-output/matlab-runtime.txt','w');
            assert(fid ~= -1);
            fprintf(fid,'version=%s\nthreads=%d\n',version,maxNumCompThreads);
            fclose(fid);
            addpath('tests/matlab');
            reference_model_baseline('WECCCOMP_NMPC_SPLIT_STEP_FULL',0.00025)
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Audit independent Python at the matching plant step
        run: |
          python tools/wavestar_nmpc_reference_audit.py \
            --source-dir matlab-reference-model-output \
            --hydro applications/WECCCOMP/hydroData/wavestar.h5 \
            --step 0.00025 \
            --output matlab-reference-model-output/wavestar-reference-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wavestar-nmpc-single-thread-${{ matrix.repeat }}
          path: |
            matlab-reference-model-output/WECCCOMP_NMPC_SPLIT_STEP_FULL_*
            matlab-reference-model-output/wavestar-reference-audit.json
            matlab-reference-model-output/matlab-runtime.txt
            matlab-reference-model-output/cpu.txt

  compare-repeats:
    needs: source-repeat
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: wavestar-nmpc-single-thread-*
          path: reference-artifacts
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy
      - name: Compare identical-input source repeats
        run: |
          python tools/wavestar_nmpc_reference_repeat.py \
            --left reference-artifacts/wavestar-nmpc-single-thread-a \
            --right reference-artifacts/wavestar-nmpc-single-thread-b \
            --output reference-artifacts/repeat.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wavestar-nmpc-single-thread-repeat-report
          path: reference-artifacts/repeat.json
