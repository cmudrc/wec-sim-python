name: MATLAB WaveStar fine-step source repeatability

on:
  workflow_dispatch:
    inputs:
      qp_only:
        description: Replay the checked controller fixture without rerunning the source plant
        type: boolean
        required: false
        default: false
      runner:
        description: Host for the full source repeatability probe
        type: choice
        required: false
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - macos-15-intel
          - macos-15
      plant_step:
        description: Plant integration step for the 225 s source and independent Python audit
        type: choice
        required: false
        default: '0.00025'
        options:
          - '0.00025'
          - '0.000125'

jobs:
  source-repeat:
    if: ${{ !inputs.qp_only }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 150
    env:
      MATLAB_DISABLE_CBWR: ${{ inputs.runner == 'ubuntu-latest' && '1' || '' }}
      MKL_CBWR: ${{ inputs.runner == 'ubuntu-latest' && 'COMPATIBLE' || '' }}
    strategy:
      fail-fast: false
      matrix:
        repeat: [a, b]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim
          ref: 0753b2e47f2457c078751dcfe5d251d1767b80ab
          path: matlab-ref
          filter: blob:none
          sparse-checkout: source
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim_Applications
          ref: d53d4d4c9eda2581f04204f5d394a6ef84bb099e
          path: applications
          filter: blob:none
          lfs: true
          sparse-checkout: |
            WECCCOMP/WECCCOMP_Nonlinear_Model_Predictive
            WECCCOMP/hydroData
            WECCCOMP/geometry
      - name: Pin hydrodynamics and record runner CPU
        run: |
          cp tests/fixtures/matlab/wavestar_nmpc_split_step_225s/wavestar.h5 applications/WECCCOMP/hydroData/wavestar.h5
          cmp tests/fixtures/matlab/wavestar_nmpc_split_step_225s/wavestar.h5 applications/WECCCOMP/hydroData/wavestar.h5
          mkdir -p matlab-reference-model-output
          if command -v lscpu >/dev/null 2>&1; then
            lscpu > matlab-reference-model-output/cpu.txt
          else
            uname -m > matlab-reference-model-output/cpu.txt
            sysctl hw.model >> matlab-reference-model-output/cpu.txt
            sysctl hw.ncpu >> matlab-reference-model-output/cpu.txt
            sysctl machdep.cpu.brand_string >> matlab-reference-model-output/cpu.txt 2>/dev/null || true
          fi
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Simulink Simscape Simscape_Multibody Stateflow Control_System_Toolbox Optimization_Toolbox System_Identification_Toolbox Statistics_and_Machine_Learning_Toolbox
      - name: Generate source with recorded BLAS and one thread
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            maxNumCompThreads(1);
            assert(maxNumCompThreads == 1);
            blasInfo=evalc('version -blas');
            fid=fopen('matlab-reference-model-output/matlab-runtime.txt','w');
            assert(fid ~= -1);
            fprintf(fid,'version=%s\nthreads=%d\nblas=%s\n',version,maxNumCompThreads,strtrim(blasInfo));
            fclose(fid);
            if strcmp(getenv('RUNNER_OS'),'Linux');
            assert(strcmp(getenv('MATLAB_DISABLE_CBWR'),'1'));
            assert(strcmp(getenv('MKL_CBWR'),'COMPATIBLE'));
            assert(contains(upper(blasInfo),'COMPATIBLE'),'Compatible BLAS branch was not selected');
            end;
            addpath('tests/matlab');
            reference_model_baseline('WECCCOMP_NMPC_SPLIT_STEP_FULL',${{ inputs.plant_step }})
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Audit independent Python at the matching plant step
        run: |
          python tools/wavestar_nmpc_reference_audit.py \
            --source-dir matlab-reference-model-output \
            --hydro applications/WECCCOMP/hydroData/wavestar.h5 \
            --step ${{ inputs.plant_step }} \
            --output matlab-reference-model-output/wavestar-reference-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wavestar-nmpc-platform-${{ matrix.repeat }}
          path: |
            matlab-reference-model-output/WECCCOMP_NMPC_SPLIT_STEP_FULL_*
            matlab-reference-model-output/wavestar-reference-audit.json
            matlab-reference-model-output/matlab-runtime.txt
            matlab-reference-model-output/cpu.txt

  compare-repeats:
    if: ${{ !inputs.qp_only }}
    needs: source-repeat
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: wavestar-nmpc-platform-*
          path: reference-artifacts
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Compare identical-input source repeats
        run: |
          python tools/wavestar_nmpc_reference_repeat.py \
            --left reference-artifacts/wavestar-nmpc-platform-a \
            --right reference-artifacts/wavestar-nmpc-platform-b \
            --output reference-artifacts/repeat.json
      - name: Replay logged controller inputs through Python
        run: |
          python tools/wavestar_nmpc_controller_source_probe.py \
            reference-artifacts/wavestar-nmpc-platform-a/WECCCOMP_NMPC_SPLIT_STEP_FULL_controller.mat \
            reference-artifacts/wavestar-nmpc-platform-b/WECCCOMP_NMPC_SPLIT_STEP_FULL_controller.mat \
            --end-time 40 \
            --output reference-artifacts/controller-probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wavestar-nmpc-platform-repeat-report
          path: |
            reference-artifacts/repeat.json
            reference-artifacts/controller-probe.json

  checked-qp-replay:
    if: ${{ inputs.qp_only }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    env:
      MATLAB_DISABLE_CBWR: ${{ inputs.runner == 'ubuntu-latest' && '1' || '' }}
      MKL_CBWR: ${{ inputs.runner == 'ubuntu-latest' && 'COMPATIBLE' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim_Applications
          ref: d53d4d4c9eda2581f04204f5d394a6ef84bb099e
          path: applications
          filter: blob:none
          sparse-checkout: WECCCOMP/WECCCOMP_Nonlinear_Model_Predictive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Prepare checked source controller inputs
        run: |
          python tools/wavestar_nmpc_checked_qp_replay.py prepare \
            --controller tests/fixtures/matlab/wavestar_nmpc_reference_convergence_225s/controller_0p25ms_compatible_amd7763.npz \
            --matrices tests/fixtures/matlab/wavestar_nmpc_full_step/direct_controller_inputs.npz \
            --controller-sha256 06d55c1972b6e9130fbeeea52d29cc6691fddfb7408c687c950ce9522c2498e3 \
            --matrices-sha256 3ff8f4ba8654ef66bf9058a9fe717cfa6c60868300d19e64a089fcb06781dbf0 \
            --output checked-qp-input.mat
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: Optimization_Toolbox
      - name: Replay pinned MATLAB QP on checked inputs
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            maxNumCompThreads(1);
            assert(maxNumCompThreads == 1);
            blasInfo=evalc('version -blas');
            fid=fopen('checked-qp-runtime.txt','w');
            assert(fid ~= -1);
            fprintf(fid,'version=%s\nthreads=%d\nblas=%s\n',version,maxNumCompThreads,strtrim(blasInfo));
            fclose(fid);
            if strcmp(getenv('RUNNER_OS'),'Linux');
            assert(contains(upper(blasInfo),'COMPATIBLE'));
            end;
            addpath('tests/matlab');
            wavestar_nmpc_checked_qp_replay('checked-qp-input.mat',
            'applications/WECCCOMP/WECCCOMP_Nonlinear_Model_Predictive',
            'checked-qp-replay.mat')
      - name: Compare complete MATLAB and Python QP plans
        run: |
          source_difference_option=()
          if [[ "$RUNNER_OS" != Linux ]]; then
            source_difference_option=(--allow-source-difference)
          fi
          python tools/wavestar_nmpc_checked_qp_replay.py compare \
            --controller tests/fixtures/matlab/wavestar_nmpc_reference_convergence_225s/controller_0p25ms_compatible_amd7763.npz \
            --matrices tests/fixtures/matlab/wavestar_nmpc_full_step/direct_controller_inputs.npz \
            --controller-sha256 06d55c1972b6e9130fbeeea52d29cc6691fddfb7408c687c950ce9522c2498e3 \
            --matrices-sha256 3ff8f4ba8654ef66bf9058a9fe717cfa6c60868300d19e64a089fcb06781dbf0 \
            --matlab-result checked-qp-replay.mat \
            "${source_difference_option[@]}" \
            --output checked-qp-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wavestar-checked-qp-replay
          path: |
            checked-qp-input.mat
            checked-qp-replay.mat
            checked-qp-report.json
            checked-qp-runtime.txt
