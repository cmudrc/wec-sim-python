name: MATLAB MOST static mooring parity

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/most-mooring-parity.yml'
      - 'tests/matlab/most_mooring_baseline.m'
      - 'tests/test_most_mooring_source.py'
      - 'wecsim/reference_models/mostMooring.py'
      - 'wecsim/__init__.py'
  pull_request:
    paths:
      - '.github/workflows/most-mooring-parity.yml'
      - 'tests/matlab/most_mooring_baseline.m'
      - 'tests/test_most_mooring_source.py'
      - 'wecsim/reference_models/mostMooring.py'
      - 'wecsim/__init__.py'
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim
          ref: 0753b2e47f2457c078751dcfe5d251d1767b80ab
          path: matlab-ref
          filter: blob:none
          sparse-checkout: source
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath(genpath('matlab-ref/source')); addpath('tests/matlab'); most_mooring_baseline
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_most_mooring_source.py
        env:
          WEC_SIM_MOST_MOORING_BASELINE: matlab-most-mooring.mat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matlab-most-mooring
          path: matlab-most-mooring.mat
