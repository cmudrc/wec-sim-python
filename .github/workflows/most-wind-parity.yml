name: MATLAB MOST wind input parity

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/most-wind-parity.yml'
      - 'tests/matlab/most_wind_baseline.m'
      - 'tests/matlab/most_wind_advection_baseline.m'
      - 'tests/test_turbsim_wind.py'
      - 'tests/test_most_wind_advection.py'
      - 'wecsim/environment/turbSim.py'
      - 'wecsim/__init__.py'
  pull_request:
    paths:
      - '.github/workflows/most-wind-parity.yml'
      - 'tests/matlab/most_wind_baseline.m'
      - 'tests/matlab/most_wind_advection_baseline.m'
      - 'tests/test_turbsim_wind.py'
      - 'tests/test_most_wind_advection.py'
      - 'wecsim/environment/turbSim.py'
      - 'wecsim/__init__.py'
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim_Applications
          ref: d53d4d4c9eda2581f04204f5d394a6ef84bb099e
          path: applications
          filter: blob:none
          sparse-checkout: MOST/mostData/turbSim
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('tests/matlab'); most_wind_baseline; most_wind_advection_baseline
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q tests/test_turbsim_wind.py
        env:
          WEC_SIM_MOST_BTS: applications/MOST/mostData/turbSim/WIND_8mps.bts
          WEC_SIM_MOST_WIND_BASELINE: matlab-most-wind.mat
      - run: python -m pytest -q tests/test_most_wind_advection.py
        env:
          WEC_SIM_MOST_ADVECTION_DIR: matlab-most-advection
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matlab-most-wind
          path: |
            matlab-most-wind.mat
            matlab-most-advection.mat
            matlab-most-advection/WIND_8mps.bts
