name: Python parity

on:
  push:
  pull_request:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e . pytest
      - run: cd /tmp && python -c 'from wecsim import WEC; print(WEC.__module__)'
      - name: Verify built wheel outside the checkout
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wecsim-wheels" .
          python -m venv --system-site-packages "$RUNNER_TEMP/wecsim-wheel-venv"
          "$RUNNER_TEMP/wecsim-wheel-venv/bin/python" -m pip install --force-reinstall --no-deps "$RUNNER_TEMP"/wecsim-wheels/wec_sim_python-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wecsim-wheel-venv/bin/python" -c 'import importlib.util, sys, wecsim; from pathlib import Path; from wecsim import WEC; assert Path(wecsim.__file__).is_relative_to(Path(sys.prefix)); assert WEC("wheel smoke").name == "wheel smoke"; assert importlib.util.find_spec("wecsim_python") is None'
          "$RUNNER_TEMP/wecsim-wheel-venv/bin/wecsim" --help > /dev/null
          "$RUNNER_TEMP/wecsim-wheel-venv/bin/wecsim-reference" --help > /dev/null
          cp "$GITHUB_WORKSPACE/tests/wheel_install_smoke.py" "$RUNNER_TEMP/"
          cp "$GITHUB_WORKSPACE/examples/data/rm3.h5" "$RUNNER_TEMP/"
          "$RUNNER_TEMP/wecsim-wheel-venv/bin/python" wheel_install_smoke.py rm3.h5
      - run: python -m compileall -q wecsim
      - run: python -m pytest -q
