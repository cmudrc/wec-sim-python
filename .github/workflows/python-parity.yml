name: Python tests

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: python-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 tools/render_parity_badge.py --check
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test]"
      - run: cd /tmp && python -c 'from wecsim import WEC; print(WEC.__module__)'
      - name: Verify built wheel outside the checkout
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wecsim-wheels" .
          python -m venv --system-site-packages "$RUNNER_TEMP/wecsim-wheel-venv"
          "$RUNNER_TEMP/wecsim-wheel-venv/bin/python" -m pip install --force-reinstall --no-deps "$RUNNER_TEMP"/wecsim-wheels/wec_sim_python-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wecsim-wheel-venv/bin/python" -c 'import importlib.util, sys, wecsim; from pathlib import Path; from wecsim import WEC; assert Path(wecsim.__file__).is_relative_to(Path(sys.prefix)); assert WEC("wheel smoke").name == "wheel smoke"; assert importlib.util.find_spec("wecsim_python") is None'
          "$RUNNER_TEMP/wecsim-wheel-venv/bin/python" -c 'import importlib.util; assert importlib.util.find_spec("wecsim.reference") is None'
          test ! -e "$RUNNER_TEMP/wecsim-wheel-venv/bin/wecsim-reference"
          "$RUNNER_TEMP/wecsim-wheel-venv/bin/wecsim" --help > /dev/null
          cp "$GITHUB_WORKSPACE/tests/wheel_install_smoke.py" "$RUNNER_TEMP/"
          cp "$GITHUB_WORKSPACE/examples/data/rm3.h5" "$RUNNER_TEMP/"
          "$RUNNER_TEMP/wecsim-wheel-venv/bin/python" wheel_install_smoke.py rm3.h5
      - run: python -m compileall -q wecsim
      - name: Test and measure coverage
        run: >-
          python -m pytest -q -n 2 --dist loadfile
          --ignore=tests/test_variable_yaw_physical_prefixes.py
          --cov=wecsim --cov-branch
          --cov-report=term
          --cov-report=xml:coverage.xml
          --cov-report=json:coverage.json
      - name: Verify coverage badge percentage
        run: python tools/render_coverage_badge.py --check
      - name: Summarize coverage
        if: always()
        run: |
          if test -f coverage.json; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          totals = json.loads(Path("coverage.json").read_text())["totals"]
          print("## Python test coverage\n")
          print(f"Combined line and branch coverage: **{totals['percent_covered_display']}%**")
          print(f"Line coverage: {totals['percent_statements_covered_display']}%")
          print(f"Branch coverage: {totals['percent_branches_covered_display']}%")
          print("\nFull XML and JSON reports are attached to this run.")
          PY
          fi
      - name: Save coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: |
            coverage.xml
            coverage.json
          if-no-files-found: ignore

  wavestar-autonomous-x86:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test]"
      - name: Gate autonomous WaveStar window work and envelope
        run: python -m pytest -q -s tests/test_wavestar_nmpc_window_envelope.py
      - name: Gate WaveStar split-step controller and physical aggregates
        run: python -m pytest -q tests/test_wavestar_split_step_portable.py
      - name: Gate compatible-source observer AR and QP component replay
        run: |
          python tools/wavestar_nmpc_reference_controller_audit.py \
            --source tests/fixtures/matlab/wavestar_nmpc_reference_convergence_225s/source_0p25ms_compatible_amd7763.npz \
            --controller tests/fixtures/matlab/wavestar_nmpc_reference_convergence_225s/controller_0p25ms_compatible_amd7763.npz \
            --expect-source-sha256 48c02a9396fd166d809abd8ce4cdd136934f9d819c6a7b9c73f01703907353b6 \
            --expect-controller-sha256 06d55c1972b6e9130fbeeea52d29cc6691fddfb7408c687c950ce9522c2498e3 \
            --check-limits
      - name: Gate checked full-plan MATLAB QP replay
        run: |
          python tools/wavestar_nmpc_checked_qp_replay.py compare \
            --controller tests/fixtures/matlab/wavestar_nmpc_reference_convergence_225s/controller_0p25ms_compatible_amd7763.npz \
            --matrices tests/fixtures/matlab/wavestar_nmpc_full_step/direct_controller_inputs.npz \
            --controller-sha256 06d55c1972b6e9130fbeeea52d29cc6691fddfb7408c687c950ce9522c2498e3 \
            --matrices-sha256 3ff8f4ba8654ef66bf9058a9fe717cfa6c60868300d19e64a089fcb06781dbf0 \
            --matlab-result tests/fixtures/matlab/wavestar_nmpc_reference_convergence_225s/checked_qp_replay_compatible_amd7763.mat \
            --matlab-replay-sha256 cbc5a2acfe651f3570db0405d040ee3d40791b07f30ac4b3d282ae289ec5af7d \
            --output "$RUNNER_TEMP/wavestar-qp-report.json" --check-limits
      - name: Gate WaveStar physical plant on delayed compatible-source requests
        run: |
          python tools/wavestar_nmpc_prescribed_reference_audit.py \
            --source tests/fixtures/matlab/wavestar_nmpc_reference_convergence_225s/source_0p25ms_compatible_amd7763.npz \
            --hydro tests/fixtures/matlab/wavestar_nmpc_split_step_225s/wavestar.h5 \
            --expect-source-sha256 48c02a9396fd166d809abd8ce4cdd136934f9d819c6a7b9c73f01703907353b6 \
            --expect-hydro-sha256 b2541ff01c319987d9157d1be9fbc9ec39a7660d0572d8e316c428b8aa3359d1 \
            --step 0.00025 --end-time 225 --check-limits

  wavestar-autonomous-m1:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test]"
      - name: Verify Apple silicon runner
        run: python -c 'import platform; assert platform.machine() == "arm64"'
      - name: Gate autonomous WaveStar window work and envelope
        run: python -m pytest -q -s tests/test_wavestar_nmpc_window_envelope.py
      - name: Gate WaveStar split-step controller and physical aggregates
        run: python -m pytest -q tests/test_wavestar_split_step_portable.py
      - name: Gate compatible-source observer AR and QP component replay
        run: |
          python tools/wavestar_nmpc_reference_controller_audit.py \
            --source tests/fixtures/matlab/wavestar_nmpc_reference_convergence_225s/source_0p25ms_compatible_amd7763.npz \
            --controller tests/fixtures/matlab/wavestar_nmpc_reference_convergence_225s/controller_0p25ms_compatible_amd7763.npz \
            --expect-source-sha256 48c02a9396fd166d809abd8ce4cdd136934f9d819c6a7b9c73f01703907353b6 \
            --expect-controller-sha256 06d55c1972b6e9130fbeeea52d29cc6691fddfb7408c687c950ce9522c2498e3 \
            --check-limits
      - name: Gate checked full-plan MATLAB QP replay
        run: |
          python tools/wavestar_nmpc_checked_qp_replay.py compare \
            --controller tests/fixtures/matlab/wavestar_nmpc_reference_convergence_225s/controller_0p25ms_compatible_amd7763.npz \
            --matrices tests/fixtures/matlab/wavestar_nmpc_full_step/direct_controller_inputs.npz \
            --controller-sha256 06d55c1972b6e9130fbeeea52d29cc6691fddfb7408c687c950ce9522c2498e3 \
            --matrices-sha256 3ff8f4ba8654ef66bf9058a9fe717cfa6c60868300d19e64a089fcb06781dbf0 \
            --matlab-result tests/fixtures/matlab/wavestar_nmpc_reference_convergence_225s/checked_qp_replay_compatible_amd7763.mat \
            --matlab-replay-sha256 cbc5a2acfe651f3570db0405d040ee3d40791b07f30ac4b3d282ae289ec5af7d \
            --output "$RUNNER_TEMP/wavestar-qp-report.json" --check-limits
      - name: Gate WaveStar physical plant on delayed compatible-source requests
        run: |
          python tools/wavestar_nmpc_prescribed_reference_audit.py \
            --source tests/fixtures/matlab/wavestar_nmpc_reference_convergence_225s/source_0p25ms_compatible_amd7763.npz \
            --hydro tests/fixtures/matlab/wavestar_nmpc_split_step_225s/wavestar.h5 \
            --expect-source-sha256 48c02a9396fd166d809abd8ce4cdd136934f9d819c6a7b9c73f01703907353b6 \
            --expect-hydro-sha256 b2541ff01c319987d9157d1be9fbc9ec39a7660d0572d8e316c428b8aa3359d1 \
            --step 0.00025 --end-time 225 --check-limits
      - name: Pair full WaveStar motion with local R2025b source
        run: python -m pytest -q -s tests/test_wavestar_local_full_source.py

  variable-yaw-prefix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q tests/test_variable_yaw_physical_prefixes.py

  hydraulic-portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q -s tests/test_oswec_hydraulic_portable.py

  rm3-native-moordyn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim_Applications
          ref: d53d4d4c9eda2581f04204f5d394a6ef84bb099e
          path: applications
          filter: blob:none
          sparse-checkout: Paraview_Visualization/RM3_MoorDyn_Viz/Mooring
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/MoorDyn
          ref: 34c0703c9a5b74fd2cc5bb52caaadaaa356d675e
          path: MoorDyn
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test]"
      - name: Gate independent RM3 motion with live native mooring
        run: >-
          python -m pytest -q
          tests/test_rm3_moordyn_initial_step_portable.py
          tests/test_rm3_moordyn_initial_step_80s.py
        env:
          LD_PRELOAD: /usr/lib/x86_64-linux-gnu/libstdc++.so.6
          WEC_SIM_RM3_H5: examples/data/rm3.h5
          WEC_SIM_MOORDYN_LIBRARY: MoorDyn/linux_libraries/x86_64/libmoordyn.so
          WEC_SIM_RM3_MOORDYN_LINES: applications/Paraview_Visualization/RM3_MoorDyn_Viz/Mooring/lines.txt
