name: MATLAB WaveStar checked AR replay

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Host for fixed-input predictor replay
        type: choice
        required: true
        options:
          - ubuntu-latest
          - macos-15-intel
          - macos-15

jobs:
  checked-ar-replay:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    env:
      MATLAB_DISABLE_CBWR: ${{ inputs.runner == 'ubuntu-latest' && '1' || '' }}
      MKL_CBWR: ${{ inputs.runner == 'ubuntu-latest' && 'COMPATIBLE' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: WEC-Sim/WEC-Sim_Applications
          ref: d53d4d4c9eda2581f04204f5d394a6ef84bb099e
          path: applications
          filter: blob:none
          sparse-checkout: WECCCOMP/WECCCOMP_Nonlinear_Model_Predictive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Prepare the checked source moment sequence
        run: >-
          python tools/wavestar_nmpc_checked_ar_replay.py prepare
          --output checked-ar-input.mat
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: System_Identification_Toolbox
      - name: Replay the pinned predictor on identical inputs
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            maxNumCompThreads(1);
            assert(maxNumCompThreads == 1);
            blasInfo=evalc('version -blas');
            fid=fopen('checked-ar-runtime.txt','w');
            assert(fid ~= -1);
            fprintf(fid,'version=%s\nthreads=%d\nblas=%s\n',version,maxNumCompThreads,strtrim(blasInfo));
            fclose(fid);
            if strcmp(getenv('RUNNER_OS'),'Linux');
            assert(contains(upper(blasInfo),'COMPATIBLE'));
            end;
            addpath('tests/matlab');
            wavestar_nmpc_checked_ar_replay('checked-ar-input.mat',
            'applications','checked-ar-replay.mat')
      - name: Compare with the checked source forecast
        run: >-
          python tools/wavestar_nmpc_checked_ar_replay.py compare
          --matlab-result checked-ar-replay.mat
          --output checked-ar-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wavestar-checked-ar-replay
          path: |
            checked-ar-input.mat
            checked-ar-replay.mat
            checked-ar-report.json
            checked-ar-runtime.txt
